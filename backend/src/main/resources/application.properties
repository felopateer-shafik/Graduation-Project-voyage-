# ========================
# SERVER
# ========================
server.port=8080
server.servlet.context-path=/api

# ========================
# DATASOURCE (MySQL)
# ========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voyage_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE
# ========================
# ??? ?? ?? update ??? ??? ??? ????? ?????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# SQL INIT (?????? ???? ????? ???????? ???? 409)
# ========================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ========================
# MAIL (SMTP OTP delivery) - ?? ????? ??????? ???
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# OTP config
otp.expiration.minutes=10
otp.length=6

# ========================
# JWT & STORAGE
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
storage.local.upload-dir=uploads
app.public-base-url=http://localhost:8080/api

# ========================
# LOGGING
# ========================
logging.level.com.voyage.backend=DEBUG
logging.level.org.springframework.web=INFO
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# ========================
# AI (OpenRouter)
# ========================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=openai/gpt-3.5-turbo